<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- B.4 Radio Button & Checkbox -->
    <!-- Radio button dan checkbox memiliki cara penulisan yang sedikit berbeda karena setiap opsi ditulis sebagai elemen <input> terpisah -->

    <!-- Radio button: Hanya bisa memilih SATU opsi -->
    <!-- Gunakan nama yang SAMA untuk mengelompokkan pilihan -->
    <p>Jenis Kelamin:</p>
    <input type="radio" id="laki" name="gender" value="L">
    <label for="laki">Laki-Laki</label><br>

    <input type="radio" id="perempuan" name="gender" value="P">
    <label for="perempuan">Perempuan</label><br>

    <!-- Checkbox: Bisa memilih LEBIH DARI SATU opsi -->
    <p>Hobi/Aktivitas yang disukai:</p>
    <input type="checkbox" id="membaca" name="hobi" value="membaca">
    <label for="membaca">Membaca</label><br>

    <input type="checkbox" id="menulis" name="hobi" value="menulis">
    <label for="menulis">Menulis</label><br>

    <input type="checkbox" id="olahraga" name="hobi" value="olahraga">
    <label for="olahraga">Olahraga</label><br>
</body>

</html>
